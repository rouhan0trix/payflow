{% extends "base.html" %}

{% block title %}Error {{ status_code }} — PayFlow{% endblock %}

{% block content %}
<div class="page-content">
  <div class="error-container">
    <div class="error-card card">
      <div class="error-code-badge">{{ status_code }}</div>
      <h1 class="error-title">{{ error_title }}</h1>
      <p class="error-message">{{ error_message }}</p>
      <div class="error-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
        <a href="{{ url_for('transactions_page') }}" class="btn btn-outline">View Transactions</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
